services:
  - type: web
    name: blue-market
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PIN
        sync: false
      - key: DATA_FILE
        value: /var/data/game-save.json
    disk:
      name: blue-market-data
      mountPath: /var/data
      sizeGB: 1
